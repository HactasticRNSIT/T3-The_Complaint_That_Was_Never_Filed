<!DOCTYPE html>
<html>
<head>
    <title>SafeWatch | Map Integration</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: sans-serif; }
        
        /* This creates the floating navigation bar */
        .floating-nav {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000; /* Keeps it above the map */
            display: flex;
            gap: 10px;
        }

        .back-btn {
            background: #00d2ff;
            color: black;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .back-btn:hover { background: #00a8cc; }

        iframe { width: 100%; height: 100vh; border: none; }
    </style>
</head>
<body>

    <div class="floating-nav">
        <a href="/dashboard" class="back-btn">← Back to SafeWatch Dashboard</a>
    </div>

    <iframe src="http://localhost:3000/map"></iframe>

</body>
</html>
