<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeWatch — Access Denied</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080b10;--surface:#0d1117;--border:#1c2333;--accent:#00d4ff;--danger:#ff3b5c;--text:#e2e8f0;--muted:#64748b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:1000;}
  nav{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 40px;border-bottom:1px solid var(--border);background:rgba(8,11,16,0.95);z-index:100;}
  .logo{display:flex;align-items:center;gap:12px;font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:var(--accent);text-decoration:none;}
  .logo-dot{width:10px;height:10px;background:var(--danger);border-radius:50%;box-shadow:0 0 8px var(--danger);}
  .user-pill{display:flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);}
  .user-pill a{color:var(--danger);text-decoration:none;border:1px solid rgba(255,59,92,0.3);padding:6px 14px;border-radius:4px;}
  .icon{font-size:80px;margin-bottom:24px;}
  h1{font-size:40px;font-weight:800;color:var(--danger);margin-bottom:12px;}
  p{font-family:'Space Mono',monospace;font-size:13px;color:var(--muted);margin-bottom:32px;max-width:400px;}
  .btn{padding:12px 28px;background:var(--accent);color:#000;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;border:none;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block;}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/"><span class="logo-dot"></span>SafeWatch</a>
  <div class="user-pill">
    {{ username }} ({{ role }})
    <a href="/logout">Logout</a>
  </div>
</nav>

<div class="icon">🔒</div>
<h1>Access Denied</h1>
<p>This page requires <strong>Admin</strong> privileges.<br>Your current role is <strong>{{ role | upper }}</strong>.</p>
<a href="/" class="btn">← Back to Analysis</a>
</body>
</html>
