<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Emergency SOS</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle, #1a0000, #000000);
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 40px;
      color: #ff4d4d;
      letter-spacing: 2px;
    }

    .sos-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      font-weight: bold;
      color: white;
      background: red;
      cursor: pointer;
      box-shadow: 0 0 20px red;
      animation: pulse 1.5s infinite;
    }

    .sos-btn:hover {
      transform: scale(1.05);
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 10px red;
      }
      50% {
        box-shadow: 0 0 40px red;
      }
      100% {
        box-shadow: 0 0 10px red;
      }
    }

    #status {
      margin-top: 30px;
      font-size: 16px;
      color: #ccc;
    }

    .warning {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <h1>EMERGENCY SOS</h1>

  <button class="sos-btn" onclick="activateSOS()">SOS</button>

  <p id="status"></p>

  <p class="warning">Only press in real emergencies</p>

  <audio id="sirenSound" src="siren.mp3"></audio>

<script>

function activateSOS() {

  document.getElementById("sirenSound").play();

  document.getElementById("status").innerText = "Locating you...";

  navigator.geolocation.getCurrentPosition(
    sendToServer,
    () => {
      document.getElementById("status").innerText =
        "Location permission denied";
    }
  );
}

function sendToServer(position) {

  let lat = position.coords.latitude;
  let lon = position.coords.longitude;

  let mapLink = "https://maps.google.com/?q=" + lat + "," + lon;

  document.getElementById("status").innerText = "Sending SOS...";

  fetch("http://127.0.0.1:5000/send_sos", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      location: mapLink
    })
  })
  .then(async (res) => {

    const data = await res.json();

    const win = window.open("", "_blank");

    if (win) {
      win.location = data.whatsapp_link;
    }

    document.getElementById("status").innerText =
      "SOS sent → WhatsApp opened";

  })
  .catch(() => {
    document.getElementById("status").innerText =
      "Error sending SOS";
  });

}

</script>

</body>
</html>
